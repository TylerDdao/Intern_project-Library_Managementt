<div class="container">
    <div class="book-cover-container"><img src="/book-covers/{{bookCover}}.jpg" class="book-cover" (error)="onImageError($event)"/></div>
    <h1 class="headline font-bold book-info">{{book.title}}</h1>
    <h1 class="caption-1 font-bold book-info">{{'book.Author'|translate}}: {{book.author}}</h1>
    <h1 class="caption-1 book-info">{{'book.Genres'|translate}}: {{book.genres}}</h1>
</div>
