<div class="bg-white border border-primary-1 rounded-[10px] px-[5px] ">
    <div class="relative grid grid-cols-3 justify-items-center py-[5px] w-[200px] caption-1 ">

        <!-- Sliding background -->
        <div
            class="absolute top-1 bottom-1 left-1 w-[calc((100%-8px)/3)] rounded-md bg-primary-1 transition-transform duration-300 ease-in-out"
            [class.translate-x-0]="langService.currentLang === 'vi'"
            [class.translate-x-full]="langService.currentLang === 'en'"
            [class.translate-x-[200%]]="langService.currentLang === 'fr'"
        ></div>

        <button type="button" (click)="langService.switchLanguage('vi')" class="relative z-10 px-[10px] py-[5px] text-center transition-colors duration-300" [class.text-soft-ice]="langService.currentLang === 'vi'" [class.text-primary-1]="langService.currentLang !== 'vi'">
            <div class="flex items-center space-x-[5px]">
                <img src="icons/vietnam.svg" class="h-[20px]"/>
                <div>Vi</div>
            </div>
        </button>

        <button type="button" (click)="langService.switchLanguage('en')" class="relative z-10 px-[10px] py-[5px] text-center transition-colors duration-300" [class.text-soft-ice]="langService.currentLang === 'en'" [class.text-primary-1]="langService.currentLang !== 'en'">
            <div class="flex items-center space-x-[5px]">
                <img src="icons/united-state.svg" class="h-[20px]"/>
                <div>En</div>
            </div>
        </button>


        <button type="button" (click)="langService.switchLanguage('fr')" class="relative z-10 px-[10px] py-[5px] text-center transition-colors duration-300" [class.text-soft-ice]="langService.currentLang === 'fr'" [class.text-primary-1]="langService.currentLang !== 'fr'">
            <div class="flex items-center space-x-[5px]">
                <img src="icons/france.svg" class="h-[20px]"/>
                <div>Fr</div>
            </div>
        </button>
    </div>
</div>
