<app-navbar></app-navbar>
<div class="body-container">
    <div class="reset-password-container">
            <p class="headline font-bold">{{'forgotPassword.resetPassword'|translate}}</p>
            <form [formGroup]="passwordForm" id="passwordForm" (ngSubmit)="onSubmit()">
                <div class="flex flex-col">
                    <label for="newPassword">{{'user.New-password' |translate}}</label>
                    <input id="newPassword" formControlName="newPassword" placeholder="{{'user.New-password' | translate}}" type="password" class="rounded-[10px]" [class]="isPasswordMatch == true ? 'bg-pastel-blue text-dodger-blue' : 'bg-pastel-red text-tomato-red'"/>
                </div>

                <div class="flex flex-col">
                    <label for="confirmPassword">{{'user.Old-password' |translate}}</label>
                    <input id="confirmPassword" formControlName="confirmPassword" placeholder="{{'user.Confirm-password' | translate}}" type="password" class="rounded-[10px]" [class]="isPasswordMatch == true ? 'bg-pastel-blue text-dodger-blue' : 'bg-pastel-red text-tomato-red'"/>
                    @if (!isPasswordMatch) {
                        <small>{{"verification.Your-passswod-is-not-match"|translate}}</small>
                    }
                </div>

                <div class="flex flex-col">
                    <p [class]="isPasswordValid == false ? 'text-tomato-red font-bold' : 'text-deep-charcoal'">{{'signup.Your-password-must-have'|translate}}:</p>
                        <ul class="list-disc list-inside" [class]="isPasswordValid==false ? 'text-tomato-red font-bold' : 'text-deep-charcoal'">
                            <li>{{'signup.At-least-8-characters' | translate}}</li>
                            <li>{{"signup.1-special-character" | translate}}</li>
                        </ul>
                </div>
            </form>

            <div class="flex flex-col space-y-[10px]">
                <button type="submit" form="passwordForm" class="w-full bg-steel-blue px-[10px] py-[5px] text-soft-ice caption-1 rounded-[10px]">{{'form.Save'|translate}}</button>
                <button type="button" class="border border-primary-1 px-[10px] py-[5px] text-primary-1 caption-1 rounded-[10px] hover:bg-primary-1 hover:text-soft-ice transition ease-in-out">{{'signup.Back-to-login'|translate}}</button>
            </div>
        </div>
