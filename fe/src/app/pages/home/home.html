<div class="desktop-home-container">
    <div class="desktop-statistics-area">
        <div class="flex flex-col items-center justify-center">
            <h1 class="text-deep-charcoal desktop-title font-bold">{{'home.number-of-books-by-genre' |translate}}</h1>
            <div class="w-[700px] h-[300px]">
                <app-chart-component
                [labels]="['Fiction', 'Non-Fiction', 'Science', 'History']"
                [data]="[120, 90, 60, 30]"
                label="Books"
                type="bar"/>
            </div>
        </div>

                    [bookName]="'Go for it, Nakamura-kun!'"

                    [subject]="'Review of my favorite manga recently!!'"
