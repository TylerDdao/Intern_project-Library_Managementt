<app-navbar></app-navbar>
<div class="body-container">
    <div class="forgot-password-container">
        <div class="flex justify-between items-center">
            <p class="headline font-bold">{{'forgotPassword.Forgot-password'|translate}}</p>
        </div>
        <div class="info-container">
            <form [formGroup]="resetPasswordForm" id="resetPasswordForm" (ngSubmit)="onSubmit()">
                <div class="flex flex-col">
                    <label for="email">{{'forgotPassword.Please-enter-your-email'|translate}}</label>
                    <input 
                    id="email" 
                    formControlName="email" 
                    placeholder="{{'user.Email' | translate}}" 
                    type="email" 
                    class="rounded-[10px]"
                    [class]="!isEmailValid ? 'bg-pastel-red text-tomato-red' : 'bg-pastel-blue text-dodger-blue'"/>                
                    </div>
            </form>
            @if (!isEmailValid) {
                <small>{{"verification.Please-enter-a-valid-email"|translate}}</small>
            }
        </div>

        <div class="flex space-x-[10px]">
            @if (isSendingEmail) {
                <div class="bg-steel-blue/50 px-[10px] py-[5px] text-soft-ice/50 cursor-not-allowed rounded-[10px] select-none caption-1">{{'email.Sending'|translate}}...</div>
            }
            @else {
                <button type="submit" form="resetPasswordForm" class="bg-steel-blue px-[10px] py-[5px] text-soft-ice caption-1 rounded-[10px]">{{'form.Confirm'|translate}}</button>
            }
            <button class="border border-tomato-red px-[10px] py-[5px] text-tomato-red rounded-[10px] caption-1" (click)="close()">{{'signup.Back-to-login'|translate}}</button>
        </div>
    </div>
</div>

@if (isSendingEmail) {
    <div class="fixed inset-0 flex items-center justify-center bg-soft-ice/50">
        <app-loading-component></app-loading-component>
    </div>
}
