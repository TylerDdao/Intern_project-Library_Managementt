<div class="container">
    <div class="flex justify-between items-center">
        <p class="headline font-bold">{{'newBookForm.Create-new-book'|translate}}</p>
        <span (click)="close()" class="material-symbols-outlined cursor-pointer">close</span>
    </div>

    <div class="body font-bold">{{'newBookForm.Available-genres'|translate}}</div>
    @if (genres) {
        <div class="flex flex-col space-y-[5px] overflow-y-auto max-h-[500px]">
            @for (genre of genres; track $index) {
                <div class="flex items-center space-x-[5px]">
                    <div class="w-full px-[10px] py-[5px] rounded-[10px] select-none bg-primary-1 text-soft-ice" >{{genre.name}}</div>
                </div>                
            }
        </div>
        <app-pages-component [pages]="genresPage"></app-pages-component>
    }
    @else {
        <div class="flex justify-center"><div class="w-10 h-10 border-4 border-gray-200 border-t-blue-500 rounded-full animate-spin"></div></div>
    }
    
    <div class="flex space-x-[10px]">
        <button type="submit" form="newUserForm" class="bg-steel-blue px-[10px] py-[5px] text-soft-ice body rounded-[10px]">{{'form.Save'|translate}}</button>
        <button class="border border-tomato-red px-[10px] py-[5px] text-tomato-red body rounded-[10px]" (click)="close()">{{'form.Cancel'|translate}}</button>
    </div>
</div>
