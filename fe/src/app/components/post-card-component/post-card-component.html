@if (post) {
    <div class="post-card">
        <div class="user-info-container">
            <div class="flex space-x-[5px] items-center">
                <div class="user-pfp bg-steel-blue"></div>
                <div>
                    <div class="title">@{{post.createdBy}}</div>
                    <div>{{formattedCreatedAt}}</div>
                </div>
            </div>
        </div>

        <div class="book-info-container">
            <div class="flex space-x-[5px] items-start">
                <img src="/book-covers/{{bookCover}}.jpg" class="book-cover"/>
                <div>
                    <h1 class="header font-bold">{{'book.Title'|translate}}: {{post.book.title}}</h1>
                    <h1 class="subheader font-bold">{{'book.Author'|translate}}: {{post.book.author}}</h1>
                    <h1 class="subheader">{{'book.Genres'|translate}}: {{post.book.genres}}</h1>
                </div>
            </div>
        </div>
        <div class="post-subject-container">
            <h1 class="header font-bold">{{post.subject}}</h1>
        </div>
        <div class="post-content-container">
            <h1 class="body">{{post.content}}</h1>
        </div>

        <div class="post-react-container">
            <div class="flex items-center space-x-[5px]">
                <button (click)="toggleLike()"><span class="material-symbols-outlined text-sky-blue icon" [class.active]="post.liked">thumb_up</span></button>

                <h1 class="body">{{formattedLikeCount}}</h1>
            </div>

            <div class="flex items-center space-x-[5px]">
                <button><span class="material-symbols-outlined text-sky-blue">comment</span></button>
                <h1 class="body">{{formattedCommentCount}}</h1>
            </div>
        </div>
    </div>
}
