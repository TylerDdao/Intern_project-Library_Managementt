@if (post) {
    <div class="post-card">
        <div class="post-info-area">
            <div class="flex space-x-[5px] items-center">
                <div class="user-pfp bg-steel-blue"></div>
                <div>
                    <h1 class="font-bold body">@{{post.createdBy}}</h1>
                    <h2 class="caption-2">{{formattedPostedAt}}</h2>
                </div>
            </div>
            <div>
                <div class="flex items-start space-x-[5px]">
                    <img src='/book-covers/{{bookCover}}.jpg' alt={{post.book.title}} class="book-cover">
                    <div>
                        <h1 class="caption-1 line-clamp-2">{{post.book.title}}</h1>
                        <h1 class="caption-2 line-clamp-1">{{'book.Author'|translate}}: {{post.book.author}}</h1>
                        <h1 class="caption-2 line-clamp-1">{{'book.Genres'|translate}}: {{post.book.genres}}</h1>
                    </div>
                </div>
                <div class="w-full border my-[10px] border-sky-blue"></div>
                <h2 class="headline line-clamp-2">{{post.subject}}</h2>
                <p class="caption-1 line-clamp-3">{{post.content}}</p>
            </div>
        </div>

        <div class="flex items-center justify-evenly w-full">
            <div class="flex items-center space-x-[5px]">
                <span class="material-symbols-outlined text-sky-blue icon cursor-pointer">thumb_up</span>
                <h1 class="caption-2">{{formattedLikeCount}}</h1>
            </div>

            <div class="flex items-center space-x-[5px]">
                <span class="material-symbols-outlined text-sky-blue cursor-pointer">comment</span>
                <h1 class="caption-2">{{formattedCommentCount}}</h1>
            </div>
        </div>
    </div>
}
