spring.application.name=library-management

jwt.secret=${JWT_SECRET:IELlnjS/emhvXNtS67LRAxA2Xhfla9NPDiL80eNVhoo=}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.datasource.url=jdbc:mysql://localhost:3306/library_db?zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.servlet.context-path=/api

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

logging.level.root=INFO
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.upload.dir=uploads/book-covers/

spring.data.redis.host=localhost
spring.data.redis.port=6379

frontend.url=http://localhost:4200
backend.url=http://localhost:8080/api

turnstile.secret-key=${TURNSTILE_SECRET_KEY:1x0000000000000000000000000000000AA}
turnstile.enabled=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true