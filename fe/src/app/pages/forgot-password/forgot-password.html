<app-navbar></app-navbar>
<div class="fixed inset-0 flex items-center justify-center">
    <div class="container">
        <div class="flex justify-between items-center">
            <p class="headline font-bold">{{'forgotPassword.Forgot-password'|translate}}</p>
        </div>
        <div class="info-container">
            <form [formGroup]="resetPasswordForm" id="resetPasswordForm" (ngSubmit)="onSubmit()">
                <div class="flex flex-col">
                    <label for="email">{{'forgotPassword.Please-enter-your-email'}}</label>
                    <input 
                    id="email" 
                    formControlName="email" 
                    placeholder="{{'user.Email' | translate}}" 
                    type="email" 
                    class="rounded-[10px]"
                    [class]="resetPasswordForm.get('email')?.hasError('email') || !isEmailValid ? 'bg-pastel-red text-tomato-red' : 'bg-pastel-blue text-dodger-blue'"/>                
                    </div>
            </form>
        </div>

        <div class="flex space-x-[10px]">
            @if (isSendingEmail) {
                <div class="bg-steel-blue/50 px-[10px] py-[5px] text-soft-ice/50 cursor-not-allowed body rounded-[10px] select-none">{{'email.Sending'|translate}}</div>
            }
            @else {
                <button type="submit" form="resetPasswordForm" class="bg-steel-blue px-[10px] py-[5px] text-soft-ice body rounded-[10px]">{{'form.Confirm'|translate}}</button>
            }
            <button class="border border-tomato-red px-[10px] py-[5px] text-tomato-red body rounded-[10px]" (click)="close()">{{'signup.Back-to-login'|translate}}</button>
        </div>
    </div>
</div>
