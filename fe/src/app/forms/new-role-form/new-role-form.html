<div class="container">
    <div class="flex justify-between items-center">
        <p class="headline font-bold">{{"form.New-role"|translate}}</p>
        <span (click)="close()" class="material-symbols-outlined cursor-pointer">close</span>
    </div>
    <form [formGroup]="newRoleForm" id="newRoleForm" (ngSubmit)="onSubmit()" class="form-container">
        <div class="flex flex-col">
            <label for="roleName">{{"form.Role-name"|translate}}</label>
            <input id="roleName" formControlName="roleName" type="text" class="bg-pastel-blue text-dodger-blue rounded-[10px] w-full" placeholder="ROLE_[{{'form.Role-name'|translate}}]"/>
        </div>

        <div>
            <div class="headline">{{"features.Features" | translate}}</div>
            <div class="features-container">
                @for (feature of features; track $index) {
                    <div 
                        [class]="addedFeatures.includes(feature) 
                            ? 'p-[5px] bg-primary-1 text-soft-ice text-center rounded-[10px] select-none transition-colors ease-in-out cursor-pointer' 
                            : 'p-[5px] bg-tomato-red text-soft-ice text-center rounded-[10px] select-none transition-colors ease-in-out cursor-pointer'"
                        (click)="handleToggleFeature(feature)">
                        {{feature.name}}
                    </div>
                }
            </div>
        </div>

        <div class="flex space-x-[10px]">
            <button type="submit" form="newUserForm" class="bg-steel-blue px-[10px] py-[5px] text-soft-ice body rounded-[10px]">{{'form.Save'|translate}}</button>
            <button class="border border-tomato-red px-[10px] py-[5px] text-tomato-red body rounded-[10px]" (click)="close()">{{'form.Cancel'|translate}}</button>
        </div>
    </form>
    
</div>
