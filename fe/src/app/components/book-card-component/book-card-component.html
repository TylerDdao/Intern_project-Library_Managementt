<div class="container">
    <div class="book-cover-container"><img src="/book-covers/{{book.bookName.replaceAll(' ', '-').toLowerCase()}}.jpg" class="book-cover"/></div>
    <h1 class="subheader font-bold">{{book.bookName}}</h1>
    <h1 class="body font-bold">{{'book.Author'|translate}}: {{book.author}}</h1>
    <h1 class="body">{{'book.Genres'|translate}}: {{book.genres}}</h1>
</div>
