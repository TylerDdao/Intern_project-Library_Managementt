@if (pages) {
    <div class="flex space-x-[5px] items-center py-[10px]">
        @if (!pages.first) {
            <span class="material-symbols-outlined cursor-pointer select-none" (click)="apply(pages.number-1)">
                arrow_back_ios
            </span>
        }
        <p>{{'page.Page'|translate}}: {{pages.number + 1}}/{{pages.totalPages}}</p>
        @if (!pages.last) {
            <span class="material-symbols-outlined cursor-pointer select-none" (click)="apply(pages.number+1)">
                arrow_forward_ios
            </span>
        }
    </div>
}
