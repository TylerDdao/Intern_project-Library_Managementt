<app-navbar></app-navbar>
<div class="min-h-screen flex flex-col justify-center items-center">
    <div class="box">
        <h1 class="title text-steel-blue">Library Management System</h1>
        <div class="flex flex-col justify-center items-center space-y-[20px] w-full">
            <div class="flex flex-col items-center justify-center w-full space-y-[20px] w-full">
                <p class="header text-steel-blue">{{'forgotPassword.forgot-password' | translate}}</p>
                <input type="email" placeholder="{{'signup.email' | translate}}" class="rounded-lg p-[10px] bg-pastel-blue text-dodger-blue w-full placeholder"/>
                <button type="submit" form="signupForm" class="text-soft-ice bg-steel-blue rounded-lg p-[10px] font-bold w-full">{{'forgotPassword.confirm' | translate}}</button>
                <button (click)="router.navigate(['/login'])" class="text-soft-ice w-full bg-steel-blue rounded-lg p-[10px] font-bold">{{'signup.back-to-login' | translate}}</button>
            </div>
        </div>
    </div>
</div>
